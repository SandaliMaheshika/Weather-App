<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- main dashboard -->
    <div class="dashboard">

        <!-- Header section -->
        <Header class="Header">
            <div class="logo">🌥️ SkyCast</div>
            <div class="location"><span id="location">Colombo, Sri Lanka</span></div>

            <div class="search_box">
                <input type="text" id="cityinput" placeholder="Search City...">
                <button id="searchBtn">Search</button>
            </div>

            <div id="themBtn">🌙</div>

        </Header>

        <!-- Main weather section -->
        <main class="main_content">

            <!-- current weather -->
            <section current_weather>

                <h2>Today's Weather</h2>

                <div class="temperature"><span id="temperature">29</span>℃</div>
                <div class="weather_icon" id="weathericon">🌤️</div>

                <p id="weatherdescription">Search for a City</p>

                <div class="weather_details">

                    <p>
                        💧 Humidity :
                        <span id="humidity">75</span>%
                    </p>

                    <p>
                        💨 Wind:
                        <span id="wind">7.6</span>km/h
                    </p>

                </div>

            </section>


            <!-- weekly forcast -->
            <section class="forecast_section">

                <h2>Next 7 Days</h2>

                <div class="forcast_details" id="forcastdetails">
                    <p><span id="sundayLogo">🌤️</span>Sunday</p>
                    <p><span id="sunday">28</span>℃</p>

                    <p><span id="mondayLogo">🌤️</span>Monday</p>
                    <p><span id="monday">30</span>℃</p>

                    <p><span id="tuesdayLogo">🌤️</span>Tuesday</p>
                    <p><span id="tuesday">29</span>℃</p>

                    <p><span id="wednesdayLogo">🌤️</span>Wednesday</p>
                    <p><span id="wednesday">31</span>℃</p>

                    <p><span id="thursdayLogo">🌤️</span>Thursday</p>
                    <p><span id="thursday">32</span>℃</p>

                    <p><span id="fridayLogo">🌤️</span>Friday</p>
                    <p><span id="friday">30</span>℃</p>

                    <p><span id="saturdayLogo">🌤️</span>Saturday</p>
                    <p><span id="saturday">30</span>℃</p>

                </div>

            </section>


            <!-- rain chart -->
            <section class="rain_chart">

                <h2>Chance Of Rain</h2>

                <div class="rain_chart" id="rainchart">
                    <canvas id="rainChartCanvas"></canvas>
                </div>

            </section>


            <!-- Global Map -->
            <section class="map-section">

                <h2>Global Weather Map</h2>

                <div id="weatherMap" class="weather-map">

                    <!-- Weather map will be added here -->

                </div>

            </section>


            <!-- Other Cities -->
            <section class="cities-section">

                <h2>Other Large Cities</h2>

                <div id="citiesContainer" class="cities-container">

                    <!-- City weather cards will be added here -->

                </div>

            </section>


        </main>







    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
